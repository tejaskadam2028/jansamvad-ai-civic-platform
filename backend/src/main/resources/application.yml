server:
  port: 8080

spring:
  application:
    name: jansamvad-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/jansamvad?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:rootpassword}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRlbW8tc2VjcmV0LWtleS1mb3ItamFuc2FtdmFkLWRlbW8tb25seS1kby1ub3QtdXNlLWluLXByb2R1Y3Rpb24=}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  upload:
    dir: ${UPLOAD_DIR:uploads}

# H2 test profile
---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:jansamvad;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
